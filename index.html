<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>biz,ikimiz. 🩵</title>

    <link rel="apple-touch-icon" href="https://dl.dropboxusercontent.com/scl/fi/97d1blixf9m9repa05ieg/395.jpg?rlkey=jzlawtskyb1bra6hhnu8t51xm&st=o15vjj78&raw=1">
    <link rel="icon" type="image/jpeg" href="https://dl.dropboxusercontent.com/scl/fi/97d1blixf9m9repa05ieg/395.jpg?rlkey=jzlawtskyb1bra6hhnu8t51xm&st=o15vjj78&raw=1">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="biz,ikimiz.">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

    <style>
        body { background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); height: 100vh; overflow: hidden; margin: 0; font-family: sans-serif; }
        .wasted-font { font-family: 'Caveat', cursive; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        
        /* Ana Ekrana Ekle Uyarısı */
        #pwaBadge {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #0ea5e9; color: white; padding: 12px 20px; border-radius: 50px;
            z-index: 10000; font-weight: bold; box-shadow: 0 10px 15px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 10px; animation: bounce 2s infinite; cursor: pointer;
        }
        @keyframes bounce { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -10px); } }

        /* Giriş */
        #loginOverlay { position: fixed; inset: 0; background: #bae6fd; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
        .login-card { background: white; padding: 2.5rem; border-radius: 3rem; width: 90%; max-width: 400px; text-align: center; }
        .user-btn { width: 100%; padding: 1.25rem; border-radius: 1.5rem; display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 1rem; border: none; cursor: pointer; }
        .sky-btn { background: #f0f9ff; color: #0369a1; border: 2px solid #7dd3fc; }
        .pink-btn { background: #fdf2f8; color: #be185d; border: 2px solid #f9a8d4; }
        .password-input { width: 100%; padding: 1rem; border-radius: 1.25rem; border: 2px solid #e0f2fe; text-align: center; font-size: 1.5rem; outline: none; }
        .login-btn { width: 100%; background: #0ea5e9; color: white; padding: 1.25rem; border-radius: 1.5rem; font-weight: bold; margin-top: 1rem; border: none; cursor: pointer; }

        /* Mesajlar */
        .page { display: none; height: 100vh; flex-direction: column; padding-top: 70px; }
        .active-page { display: flex; }
        .messages-container { flex: 1; overflow-y: auto; padding: 1rem 1.5rem 10rem; display: flex; flex-direction: column; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 20px; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .sent { background: #60a5fa; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .received { background: white; color: #1e3a8a; align-self: flex-start; border-bottom-left-radius: 4px; }

        /* Alt Nav & Input */
        .bottom-nav { position: fixed; bottom: 1.5rem; left: 2rem; right: 2rem; border-radius: 2.5rem; padding: 1rem; display: flex; justify-content: space-around; z-index: 50; }
        .nav-btn { color: #bae6fd; font-size: 1.5rem; background: none; border: none; cursor: pointer; }
        .active-nav { color: #0ea5e9; transform: scale(1.2); }
        .input-container { position: fixed; bottom: 6.5rem; left: 1.5rem; right: 1.5rem; padding: 0.5rem; border-radius: 3rem; display: flex; align-items: center; }
        .chat-input { flex: 1; background: transparent; padding: 0.8rem 1.2rem; border: none; outline: none; }
        .send-btn { background: #0ea5e9; color: white; width: 3.5rem; height: 3.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; }

        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Yemek Kartı */
        .food-card { padding: 2rem; border-radius: 3rem; text-align: center; margin: auto; width: 90%; max-width: 350px; }
        .meal-box { background: rgba(255,255,255,0.5); margin: 1.5rem 0; padding: 1.2rem; border-radius: 1.5rem; font-weight: bold; min-height: 80px; display: flex; align-items: center; justify-content: center; border: 1px dashed #7dd3fc; }
    </style>
</head>
<body>

    <div id="pwaBadge" onclick="this.style.display='none'">
        <i class="fas fa-plus-circle"></i> Ana Ekrana Eklemeyi Unutma! 🩵
    </div>

    <div id="loginOverlay">
        <div class="login-card" id="loginCard">
            <h1 class="text-5xl wasted-font text-sky-600 mb-8">biz,ikimiz. 🩵</h1>
            <div id="userSelection" class="space-y-4">
                <button onclick="selectUser('MokmokBey')" class="user-btn sky-btn">
                    <span>🐈 Mokmok Bey</span> <i class="fas fa-heart"></i>
                </button>
                <button onclick="selectUser('Mokmokella')" class="user-btn pink-btn">
                    <span>🐈‍⬛ Mokmokella Hanim</span> <i class="fas fa-heart"></i>
                </button>
            </div>
            <div id="passwordArea" class="hidden space-y-4">
                <p id="selectedUserLabel" class="text-sky-500 font-bold italic"></p>
                <input type="tel" id="passInput" placeholder="neydi acaba? 🤔" class="password-input">
                <button onclick="checkPassword()" class="login-btn">mokmok yap...</button>
                <p id="errorMsg" class="text-red-500 text-sm font-bold hidden mt-2">Mokmoklanma başarısız oldu ! 😏</p>
            </div>
        </div>
    </div>

    <header class="fixed top-0 w-full text-center p-4 z-40">
        <h1 class="text-4xl wasted-font text-sky-600">biz,ikimiz.</h1>
    </header>

    <div id="chatPage" class="page active-page">
        <div id="notesList" class="messages-container no-scrollbar"></div>
        <div class="input-container glass">
            <input id="noteInput" type="text" placeholder="Mokmoklanmaya başla..." class="chat-input">
            <button onclick="saveNote()" class="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="foodPage" class="page">
        <div class="food-card glass">
            <div class="text-6xl mb-4">😋</div>
            <h2 class="text-3xl wasted-font text-sky-700">ne yicez?</h2>
            <div id="mealDisplay" class="meal-box italic text-sky-700">Bekleniyor...</div>
            <button onclick="rollMeal()" class="login-btn">ACIKTIM BAKİİİYİMMM 😋😡</button>
        </div>
    </div>

    <nav class="bottom-nav glass">
        <button onclick="showPage('chatPage', this)" class="nav-btn active-nav"><i class="fas fa-comment-dots"></i></button>
        <button onclick="showPage('foodPage', this)" class="nav-btn"><i class="fas fa-utensils"></i></button>
    </nav>

    <script>
        if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
            document.getElementById('pwaBadge').style.display = 'none';
        }

        const firebaseConfig = {
            apiKey: "AIzaSyCPGow-3OQWOMpAN1X3O8OyKxP-ldFwjCA",
            authDomain: "mokmok-s.firebaseapp.com",
            databaseURL: "https://mokmok-s-default-rtdb.firebaseio.com",
            projectId: "mokmok-s",
            storageBucket: "mokmok-s.firebasestorage.app",
            messagingSenderId: "133265891997",
            appId: "1:133265891997:web:cbcc57323e368eecd36a74"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentUser = "";
        const passwords = { "MokmokBey": "3091", "Mokmokella": "1326" };

        function selectUser(user) {
            currentUser = user;
            document.getElementById('userSelection').classList.add('hidden');
            document.getElementById('passwordArea').classList.remove('hidden');
            document.getElementById('selectedUserLabel').innerText = "Selam " + user;
        }

        function checkPassword() {
            const input = document.getElementById('passInput').value;
            if(input === passwords[currentUser]) {
                document.getElementById('loginOverlay').style.opacity = '0';
                setTimeout(() => document.getElementById('loginOverlay').style.display = 'none', 500);
                loadMessages();
            } else {
                document.getElementById('loginCard').classList.add('shake');
                document.getElementById('errorMsg').classList.remove('hidden');
                setTimeout(() => document.getElementById('loginCard').classList.remove('shake'), 400);
            }
        }

        function showPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-nav'));
            btn.classList.add('active-nav');
        }

        function saveNote() {
            const input = document.getElementById('noteInput');
            if(!input.value.trim()) return;
            database.ref('notlar').push().set({ sender: currentUser, icerik: input.value, tarih: Date.now() });
            input.value = "";
        }

        function loadMessages() {
            database.ref('notlar').on('value', (snapshot) => {
                const notesList = document.getElementById('notesList');
                const data = snapshot.val();
                if (data) {
                    notesList.innerHTML = Object.values(data).map(n => `<div class="message ${n.sender === currentUser ? 'sent' : 'received'}"><div class="text-[9px] font-bold opacity-70">${n.sender}</div><div>${n.icerik}</div></div>`).join('');
                    notesList.scrollTop = notesList.scrollHeight;
                }
            });
        }

        function rollMeal() {
            const yemekler = ["Pizza,Pizza,Pizza", "Böörrrgırr Kinngg", "Kremalı Mokmok Makarnası", "Lamacunnn", "Şuşşşhiii", "Popppeyeesss", "Köfte Patatessshhh"];
            document.getElementById('mealDisplay').innerText = yemekler[Math.floor(Math.random() * yemekler.length)];
        }
    </script>
</body>
</html>
